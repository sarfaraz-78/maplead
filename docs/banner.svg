<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>

  <!-- Decorative dots/grid -->
  <g fill="#FFFFFF" opacity="0.08">
    <circle cx="100" cy="60" r="3"/>
    <circle cx="160" cy="60" r="3"/>
    <circle cx="100" cy="120" r="3"/>
    <circle cx="160" cy="120" r="3"/>
    <circle cx="940" cy="320" r="3"/>
    <circle cx="1000" cy="320" r="3"/>
    <circle cx="940" cy="260" r="3"/>
    <circle cx="1000" cy="260" r="3"/>
    <circle cx="1080" cy="80" r="4"/>
    <circle cx="1140" cy="80" r="4"/>
  </g>

  <!-- Map pin icon -->
  <g transform="translate(60, 80)">
    <path d="M40 0 C18 0 0 18 0 40 C0 60 40 110 40 110 C40 110 80 60 80 40 C80 18 62 0 40 0 Z" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="40" cy="40" r="14" fill="#2563EB"/>
  </g>

  <!-- Wordmark -->
  <text x="180" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="72" font-weight="900" fill="#FFFFFF" letter-spacing="-2">MapLead</text>

  <!-- Subtitle -->
  <text x="60" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="22" font-weight="500" fill="#FFFFFF" opacity="0.95">
    Turn Google Maps searches into Excel-ready business leads
  </text>

  <!-- Pills -->
  <g transform="translate(60, 260)">
    <g>
      <rect width="120" height="36" rx="18" fill="#FFFFFF" opacity="0.15"/>
      <text x="60" y="24" text-anchor="middle" font-family="-apple-system, sans-serif"
            font-size="14" font-weight="600" fill="#FFFFFF">📊 Excel</text>
    </g>
    <g transform="translate(135, 0)">
      <rect width="110" height="36" rx="18" fill="#FFFFFF" opacity="0.15"/>
      <text x="55" y="24" text-anchor="middle" font-family="-apple-system, sans-serif"
            font-size="14" font-weight="600" fill="#FFFFFF">📄 CSV</text>
    </g>
    <g transform="translate(260, 0)">
      <rect width="120" height="36" rx="18" fill="#FFFFFF" opacity="0.15"/>
      <text x="60" y="24" text-anchor="middle" font-family="-apple-system, sans-serif"
            font-size="14" font-weight="600" fill="#FFFFFF">🔧 JSON</text>
    </g>
    <g transform="translate(395, 0)">
      <rect width="170" height="36" rx="18" fill="#FFFFFF" opacity="0.15"/>
      <text x="85" y="24" text-anchor="middle" font-family="-apple-system, sans-serif"
            font-size="14" font-weight="600" fill="#FFFFFF">🌍 11 locales</text>
    </g>
    <g transform="translate(580, 0)">
      <rect width="160" height="36" rx="18" fill="#FFFFFF" opacity="0.15"/>
      <text x="80" y="24" text-anchor="middle" font-family="-apple-system, sans-serif"
            font-size="14" font-weight="600" fill="#FFFFFF">🛡️ Stealth mode</text>
    </g>
  </g>
</svg>
