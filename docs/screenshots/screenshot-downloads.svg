<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="1200" height="380" fill="#F8FAFC"/>

  <!-- Document icon with arrow -->
  <g transform="translate(80, 60)">
    <!-- doc -->
    <rect width="180" height="240" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="20" y="30" width="100" height="10" rx="2" fill="#2563EB" opacity="0.3"/>
    <rect x="20" y="55" width="140" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="20" y="70" width="140" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="20" y="85" width="120" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="20" y="110" width="140" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="20" y="125" width="130" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="20" y="140" width="100" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="20" y="165" width="140" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="20" y="180" width="110" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="20" y="195" width="140" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="20" y="210" width="80" height="6" rx="2" fill="#CBD5E1"/>

    <!-- arrow -->
    <path d="M 230 120 L 290 120 L 290 100 L 330 140 L 290 180 L 290 160 L 230 160 Z" fill="#2563EB"/>
  </g>

  <!-- Three download buttons -->
  <g transform="translate(440, 100)">
    <text x="0" y="0" font-size="22" font-weight="800" fill="#0F172A">📥 Export your leads</text>
    <text x="0" y="30" font-size="14" fill="#64748B">One click — pick your format</text>

    <!-- Excel button -->
    <g transform="translate(0, 70)">
      <rect width="200" height="56" rx="10" fill="#10B981"/>
      <text x="100" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">📊 Excel (.xlsx)</text>
    </g>
    <!-- CSV button -->
    <g transform="translate(220, 70)">
      <rect width="200" height="56" rx="10" fill="#3B82F6"/>
      <text x="100" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">📄 CSV</text>
    </g>
    <!-- JSON button -->
    <g transform="translate(440, 70)">
      <rect width="200" height="56" rx="10" fill="#8B5CF6"/>
      <text x="100" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">🔧 JSON</text>
    </g>

    <!-- Stats line -->
    <text x="0" y="170" font-size="13" fill="#475569">✓ 47 businesses · ⭐ 4.32 avg · 🌐 81% with website · 📞 89% with phone</text>
  </g>
</svg>
