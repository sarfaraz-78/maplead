name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-tests:
    name: Smoke tests (no network / browser needed)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        run: python tests/test_smoke.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install ruff

      - run: ruff check . --output-format=github

  docker-build:
    name: Docker build (sanity check)
    runs-on: ubuntu-latest
    needs: [smoke-tests, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t maplead:test .

      - name: Smoke-test the container
        run: |
          docker run -d --name maplead -p 8501:8501 maplead:test
          sleep 15
          curl --fail http://localhost:8501/_stcore/health || (docker logs maplead && exit 1)
          docker stop maplead
